name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py forgeai tests
      - name: Build isolated test runner image
        run: docker build --pull -t forgeai-test-runner:py311 -f runner/Dockerfile .
      - name: Run tests
        env:
          FORGEAI_DOCKER_INTEGRATION: "true"
        run: pytest -q
